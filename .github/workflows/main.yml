name: Build Desktop & Mobile Apps

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Build Windows App
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install Cordova
      run: npm install -g cordova@latest
    
    - name: Setup Cordova Project
      run: |
        cordova create android-build com.esp32.servocontrol "ESP32ServoControl"
        cd android-build
        cp ../index.html www/index.html
        cp ../config.xml .
        cordova platform add android@latest
    
    - name: Build Android APK
      run: |
        cd android-build
        cordova build android
    
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: android-build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
